# tabletop.yaml

# Root dataset path
path: data/mini_tabletop  # This should contain images/train, images/val, labels/train, labels/val

# Subdirectories for images
train: images/train
val: images/val

# Number of classes (shape × color combinations)
nc: 6

# Class names (index must match label IDs in .txt)
names:
  - red_cube
  - green_cube
  - blue_cube
  - red_cylinder
  - green_cylinder
  - blue_cylinder
